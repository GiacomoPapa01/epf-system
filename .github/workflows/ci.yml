name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python tests/test_pipeline.py
      - name: Synthetic smoke test (day-ahead)
        run: python scripts/run_dayahead.py --source synthetic --days 200 --cal 150 --test 10 --recal 5
